name: Build Web Extension
on:
    push:
        branches:
            - main
        paths:
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
    pull_request:
        branches:
            - main
        paths:
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
env:
    FORCE_COLOR: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web extension
              run: pnpm buildWebStandalone

            - name: Upload Chromium extension
              uses: actions/upload-artifact@v4
              with:
                  name: extension-chrome
                  path: dist/extension-chrome.zip

            - name: Upload Firefox extension
              uses: actions/upload-artifact@v4
              with:
                  name: extension-firefox
                  path: dist/extension-firefox.zip
